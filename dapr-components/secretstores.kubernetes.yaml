# Dapr Secret Store Component Configuration for Kubernetes Secrets
# This component enables secure retrieval of secrets from Kubernetes secrets

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secret-store
  namespace: teamflow
spec:
  type: secretstores.kubernetes
  version: v1
  metadata:
  - name: "ignoreErrors"
    value: "false"

# Example secret access patterns:
# - SendGrid API Key: kubernetes-secret-store/sendgrid-credentials/api-key
# - JWT Secret: kubernetes-secret-store/jwt-secret/secret-value
# - OAuth Tokens: kubernetes-secret-store/oauth-tokens/access-token

# Required Kubernetes secrets to create:
# kubectl create secret generic sendgrid-credentials --from-literal=api-key=SG.xxx -n teamflow
# kubectl create secret generic jwt-secret --from-literal=secret-value=your-jwt-secret -n teamflow
# kubectl create secret generic teamflow-db-credentials --from-literal=connection-string=postgresql://... -n teamflow
