apiVersion: apps/v1
kind: Deployment
metadata:
  name: teamflow-frontend
  namespace: teamflow
  labels:
    app: teamflow-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teamflow-frontend
  template:
    metadata:
      labels:
        app: teamflow-frontend
    spec:
      containers:
      - name: frontend
        image: docker.io/mrowaisabdullah/teamflow-frontend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://teamflow-backend.teamflow.svc.cluster.local:8000"
        - name: NEXT_PUBLIC_WS_URL
          value: "ws://teamflow-backend.teamflow.svc.cluster.local:8000"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: teamflow-frontend
  namespace: teamflow
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: teamflow-frontend
