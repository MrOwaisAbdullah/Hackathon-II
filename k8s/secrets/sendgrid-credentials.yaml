# T080: Kubernetes Secret for SendGrid credentials
#
# IMPORTANT: This file contains a placeholder secret. For production:
# 1. Create the secret using: kubectl create secret generic sendgrid-credentials --from-literal=api-key=YOUR_SENDGRID_API_KEY --namespace=teamflow
# 2. Or use sealed-secrets / external-secrets for secure secret management
# 3. Never commit actual secrets to git

---
# Development/Testing placeholder (DO NOT USE IN PRODUCTION)
apiVersion: v1
kind: Secret
metadata:
  name: sendgrid-credentials
  namespace: teamflow
type: Opaque
stringData:
  # Placeholder: Replace with actual SendGrid API key in production
  # Get your API key from: https://dashboard.sendgrid.com/settings/api_keys
  api-key: "SG.YOUR_SENDGRID_API_KEY_HERE"

---
