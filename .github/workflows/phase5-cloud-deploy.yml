# TeamFlow Advanced Cloud Deployment - CI/CD Pipeline
# Phase 5: Event-Driven Microservices with Dapr and Kafka

name: TeamFlow Phase 5 Cloud Deploy

on:
  push:
    branches:
      - '005-advanced-cloud-deployment'
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: teamflow-backend
  IMAGE_FRONTEND: teamflow-frontend
  IMAGE_NOTIFICATION_SERVICE: teamflow-notification-service
  IMAGE_RECURRING_TASK_SERVICE: teamflow-recurring-task-service
  IMAGE_REALTIME_SYNC_SERVICE: teamflow-realtime-sync-service

jobs:
  # Stage 1: Build and Test
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: ./teamflow-web/backend
        run: |
          pip install -e ".[dev]"
          pip list

      - name: Run backend tests
        working-directory: ./teamflow-web/backend
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./teamflow-web/backend/coverage.xml
          flags: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./teamflow-web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./teamflow-web/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./teamflow-web/frontend
        run: npm test --if-present

      - name: Frontend lint
        working-directory: ./teamflow-web/frontend
        run: npm run lint --if-present

  # Stage 2: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scanning
        uses: docker/build-push-action@v5
        with:
          context: ./teamflow-web/backend
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_BACKEND }}:scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_BACKEND }}:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Stage 3: Build and Push Images
  build-images:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push'
    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.tags }}
      frontend-tag: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./teamflow-web/backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./teamflow-web/frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Microservices images
      - name: Build and push notification service image
        uses: docker/build-push-action@v5
        with:
          context: ./teamflow-web/backend/microservices/notification_service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NOTIFICATION_SERVICE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push recurring task service image
        uses: docker/build-push-action@v5
        with:
          context: ./teamflow-web/backend/microservices/recurring_task_service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_RECURRING_TASK_SERVICE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push realtime sync service image
        uses: docker/build-push-action@v5
        with:
          context: ./teamflow-web/backend/microservices/realtime_sync_service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_REALTIME_SYNC_SERVICE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stage 4: Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref != 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.teamflow.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Deploy to staging via Helm
        run: |
          helm upgrade --install teamflow ./helm/teamflow \
            --namespace teamflow-staging \
            --create-namespace \
            --values helm/teamflow/values-staging.yaml \
            --set image.backend.tag=${{ github.sha }} \
            --set image.frontend.tag=${{ github.sha }} \
            --wait \
            --timeout 10m

  # Stage 5: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        working-directory: ./teamflow-web/frontend
        run: npm ci && npx playwright install --with-deps

      - name: Run E2E tests against staging
        working-directory: ./teamflow-web/frontend
        run: npm run test:e2e
        env:
          BASE_URL: https://staging.teamflow.example.com

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./teamflow-web/frontend/playwright-report/

  # Stage 6: Deploy to Production (T166: Manual Approval Gate)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images, integration-tests]
    if: github.ref == 'refs/heads/main'
    # T166: Manual approval gate using GitHub environments
    environment:
      name: production
      url: https://teamflow.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Deploy to production via Helm
        run: |
          helm upgrade --install teamflow ./helm/teamflow \
            --namespace teamflow-production \
            --create-namespace \
            --values helm/teamflow/values-production.yaml \
            --set image.backend.tag=${{ github.sha }} \
            --set image.frontend.tag=${{ github.sha }} \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/teamflow-backend -n teamflow-production
          kubectl rollout status deployment/teamflow-frontend -n teamflow-production

      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: '${{ github.token }}'
          environment-url: https://teamflow.example.com
          environment: production
