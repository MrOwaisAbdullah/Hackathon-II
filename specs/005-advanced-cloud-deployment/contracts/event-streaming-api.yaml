# Event Streaming API Contracts (Kafka/Redpanda)

**Feature**: 005-advanced-cloud-deployment | **Version**: 1.0.0 | **Date**: 2026-01-29

---

## Overview

This document defines the Kafka event streaming contracts for the Phase 5 Advanced Cloud Deployment. All events follow the CloudEvents specification format.

---

## Event Envelope Format

All events use CloudEvents 1.0 specification:

```json
{
  "specversion": "1.0",
  "id": "uuid",
  "source": "/teamflow/{service}",
  "type": "com.teamflow.{entity}.{action}",
  "datacontenttype": "application/json",
  "subject": "{entity-id}",
  "time": "2026-01-29T12:00:00Z",
  "data": { /* Event-specific payload */ }
}
```

**Field Definitions**:

| Field | Type | Required | Description |
|-------|------|----------|-------------|
| `specversion` | string | Yes | CloudEvents spec version (always "1.0") |
| `id` | string (UUID) | Yes | Unique event identifier |
| `source` | string | Yes | Service that generated the event (e.g., `/teamflow/backend`) |
| `type` | string | Yes | Event type following naming convention |
| `datacontenttype` | string | Yes | MIME type of data (always `application/json`) |
| `subject` | string | Yes | ID of the entity this event relates to |
| `time` | string (ISO 8601) | Yes | Timestamp when event occurred |
| `data` | object | Yes | Event-specific payload |

---

## Kafka Topics

| Topic Name | Partitions | Replication | Retention | Purpose |
|------------|------------|-------------|-----------|---------|
| `task-events` | 3 | 1 (dev) / 3 (prod) | 7 days | All task state changes |
| `reminders` | 3 | 1 (dev) / 3 (prod) | 7 days | Reminder notifications |
| `time-logged` | 1 | 1 (dev) / 3 (prod) | 30 days | Time tracking events |
| `task-updates` | 3 | 1 (dev) / 3 (prod) | 1 day | Real-time sync events |

