## Consumer Groups

**Naming Convention**: `{service-name}-{service-type}`

| Consumer Group | Service | Topics | Purpose |
|----------------|---------|--------|---------|
| `recurring-task-service` | Recurring Task Service | `task-events` | Process task completion events |
| `notification-service` | Notification Service | `reminders` | Send reminder notifications |
| `realtime-sync-service` | Real-Time Sync Service | `task-updates`, `task-events` | Broadcast to WebSocket clients |
| `audit-service` | Audit Service (future) | `task-events`, `reminders`, `time-logged` | Log to database for audit trail |
| `billing-service` | Billing Service (future) | `time-logged` | Update project profitability |

---

## Partitioning Strategy

**Task Events Topic**: Partition by `task_id`
- Ensures all events for a single task go to same partition
- Maintains ordering per task
- Example: `partition = hash(task_id) % 3`

**Reminders Topic**: Round-robin partitioning
- No ordering requirement between different tasks
- Distributes load evenly across partitions
- Example: Incrementing partition counter

**Task Updates Topic**: Partition by `user_id`
- Groups events by user for efficient WebSocket broadcasting
- Example: `partition = hash(user_id) % 3`

---

## Error Handling

### Failed Event Delivery

**Strategy**: Exponential backoff retry with dead letter queue (DLQ)

**Configuration**:
```yaml
# Dapr pub/sub component
spec:
  metadata:
    - name: retries
      value: "3"
    - name: retryDelay
      value: "2000"  # 2 seconds
    - name: backoffPolicy
      value: "exponential"
```

**Dead Letter Queue Topic**: `{topic-name}-dlq`
- Example: `task-events-dlq`
- Contains failed events for manual inspection
- Retention: 30 days

---

## Event Ordering Guarantees

| Topic | Ordering Scope | Guarantee |
|-------|----------------|-----------|
| `task-events` | Per task_id | Events for same task ordered in partition |
| `reminders` | Per reminder_id | Best-effort (may be out of order) |
| `task-updates` | Per user_id | Events for same user ordered in partition |
| `time-logged` | None | No ordering guarantee |

---

## Event Replay

**Capability**: Replay events from Kafka retention period (7 days)

**Use Cases**:
- Recover from database corruption
- Rebuild read models after schema change
- Debug production issues
- Train ML models on historical data

**Replay Command**:
```bash
# Redpanda CLI
kubectl exec -it redpanda-0 -n kafka -- \
  rpk topic consume task-events --from-beginning
```

**Consumer Reset**:
```python
# Python Dapr client
# Reset consumer group offset to beginning
await dapr_client.subscribe(
    pubsub_name="kafka-pubsub",
    topic="task-events",
    consumer_group="replay-consumer",
    reset_offset="earliest"
)
```

