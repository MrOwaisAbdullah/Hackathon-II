### 2. Task Updated

**Type**: `com.teamflow.task.updated`

**Trigger**: Task fields modified (title, description, priority, etc.)

**Data Schema**:
```json
{
  "task_id": "uuid",
  "user_id": "uuid",
  "changes": {
    "field_name": {
      "from": "old_value",
      "to": "new_value"
    }
  },
  "updated_at": "ISO 8601"
}
```

**Example**:
```json
{
  "specversion": "1.0",
  "id": "650e8400-e29b-41d4-a716-446655440001",
  "source": "/teamflow/backend",
  "type": "com.teamflow.task.updated",
  "datacontenttype": "application/json",
  "subject": "task-123",
  "time": "2026-01-29T13:00:00Z",
  "data": {
    "task_id": "123e4567-e89b-12d3-a456-426614174000",
    "user_id": "123e4567-e89b-12d3-a456-426614174001",
    "changes": {
      "status": {
        "from": "todo",
        "to": "doing"
      },
      "priority": {
        "from": "high",
        "to": "urgent"
      }
    },
    "updated_at": "2026-01-29T13:00:00Z"
  }
}
```

