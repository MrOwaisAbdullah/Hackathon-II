## 4. Backend API Extensions

### 4.1 Create Task with Recurrence

**Endpoint**: `POST /api/v1/tasks`

**Description**: Create a new task with optional recurrence and reminder settings.

**Request**:
```http
POST /api/v1/tasks
Authorization: Bearer <jwt_token>
Content-Type: application/json

{
  "title": "Weekly team meeting",
  "description": "Recurring sync with the team",
  "project_id": "uuid",
  "assignee_id": "uuid",
  "due_at": "2026-02-05T10:00:00Z",
  "priority": "medium",
  "tags": ["meeting", "recurring"],
  "recurrence_rule": {
    "frequency": "weekly",
    "interval": 1,
    "days_of_week": ["Monday"],
    "end_date": "2026-12-31T23:59:59Z"
  },
  "reminder_settings": {
    "offsets": ["1d", "1h"],
    "channels": ["email", "push"],
    "custom_message": "Don't forget the team meeting!"
  }
}
```

**Response** (201 Created):
```json
{
  "data": {
    "id": "uuid",
    "title": "Weekly team meeting",
    "description": "Recurring sync with the team",
    "status": "todo",
    "priority": "medium",
    "assignee_id": "uuid",
    "due_at": "2026-02-05T10:00:00Z",
    "recurrence_rule": {
      "frequency": "weekly",
      "interval": 1,
      "days_of_week": ["Monday"],
      "end_date": "2026-12-31T23:59:59Z"
    },
    "reminder_settings": {
      "offsets": ["1d", "1h"],
      "channels": ["email", "push"]
    },
    "created_at": "2026-01-29T12:00:00Z"
  }
}
```

---

