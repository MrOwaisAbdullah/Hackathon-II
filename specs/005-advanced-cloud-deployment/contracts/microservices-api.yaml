    }
  }
]
```

---

### 3.2 Task Update Event Handler

**Endpoint**: `POST /events/task-updates`

**Description**: Receives task update events and broadcasts to connected WebSocket clients.

**Request** (from Dapr):
```http
POST /events/task-updates
Content-Type: application/json

{
  "specversion": "1.0",
  "id": "uuid",
  "source": "/teamflow/backend",
  "type": "com.teamflow.task.updated",
  "datacontenttype": "application/json",
  "subject": "task-123",
  "time": "2026-01-29T16:30:00Z",
  "data": {
    "task_id": "uuid",
    "event_type": "updated",
    "task": { /* Full task object */ },
    "updated_by": "uuid",
    "timestamp": "2026-01-29T16:30:00Z"
  }
}
```

**Processing Logic**:
1. Extract `user_id` from event data
2. Get all active WebSocket connections for this user
3. Broadcast event to all connections
4. If no connections, log and continue (fire-and-forget)

**Response** (200 OK):
```json
{
  "status": "SUCCESS",
  "broadcast_to": 3
}
```

---

### 3.3 WebSocket Connection

**Endpoint**: `WS /ws/tasks`

**Description**: WebSocket endpoint for real-time task updates.

**Connection Request**:
```http
WS /ws/tasks?token=<jwt_token>
```

**Query Parameters**:
- `token` (required): JWT token for authentication

**Connection Flow**:
1. Client connects with JWT token
2. Service validates token and extracts `user_id`
3. Connection added to `ConnectionManager`
4. Client receives `{"type": "connected", "connection_id": "uuid"}`
5. Service sends heartbeat ping every 30s
6. Client must respond with pong (connection closes if no pong for 60s)

**Server → Client Messages**:

**Connected**:
```json
{
  "type": "connected",
  "connection_id": "uuid",
  "timestamp": "2026-01-29T12:00:00Z"
}
```

**Task Created**:
```json
{
  "type": "task_created",
  "task": {
    "id": "uuid",
    "title": "Fix navbar bug",
    "status": "todo",
    "priority": "high",
    "due_at": "2026-02-01T17:00:00Z"
  },
  "timestamp": "2026-01-29T12:00:00Z"
}
```

**Task Updated**:
```json
{
  "type": "task_updated",
  "task_id": "uuid",
  "changes": {
    "status": "doing"
  },
  "timestamp": "2026-01-29T12:05:00Z"
}
```

**Task Completed**:
```json
{
  "type": "task_completed",
  "task_id": "uuid",
  "completed_at": "2026-01-29T14:00:00Z",
  "timestamp": "2026-01-29T14:00:00Z"
}
```

**Task Deleted**:
```json
{
  "type": "task_deleted",
  "task_id": "uuid",
  "timestamp": "2026-01-29T15:00:00Z"
}
```

**Ping** (Heartbeat):
```json
{
  "type": "ping",
  "timestamp": "2026-01-29T12:30:00Z"
}
```

**Error**:
```json
{
  "type": "error",
  "message": "Invalid authentication token",
  "code": "AUTH_FAILED",
  "timestamp": "2026-01-29T12:00:00Z"
}
```

**Client → Server Messages**:

**Pong** (Heartbeat Response):
```json
{
  "type": "pong",
  "timestamp": "2026-01-29T12:30:05Z"
}
```

**Disconnect**:
```json
{
  "type": "disconnect",
  "reason": "user_logout"
}
```

