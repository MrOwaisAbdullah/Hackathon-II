# Microservices API Contracts (OpenAPI 3.0)

**Feature**: 005-advanced-cloud-deployment | **Version**: 1.0.0 | **Date**: 2026-01-29

---

## Overview

This document defines the REST API and WebSocket contracts for the Phase 5 microservices (Notification, Recurring Task, Real-Time Sync).

---

## Base URLs

| Service | Base URL | Purpose |
|---------|----------|---------|
| **Backend API** | `https://api.teamflow.crm/api/v1` | Main application API |
| **Notification Service** | `http://notification-service.teamflow.svc.cluster.local:8000` | Event consumption for reminders |
| **Recurring Task Service** | `http://recurring-task-service.teamflow.svc.cluster.local:8000` | Event consumption for recurrence |
| **Real-Time Sync Service** | `ws://realtime-sync-service.teamflow.svc.cluster.local:8000` | WebSocket for real-time updates |

**Note**: Internal services use Kubernetes DNS. External access via Ingress.

---

## Authentication

All endpoints require Better Auth session cookie or JWT token.

```
Authorization: Bearer <jwt_token>
Cookie: better-auth.session_token=<session_token>
```

