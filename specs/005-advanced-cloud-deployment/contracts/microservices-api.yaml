### 2.2 Task Event Handler

**Endpoint**: `POST /events/task-events`

**Description**: Processes task completion events and creates next instance for recurring tasks.

**Request** (from Dapr):
```http
POST /events/task-events
Content-Type: application/json

{
  "specversion": "1.0",
  "id": "uuid",
  "source": "/teamflow/backend",
  "type": "com.teamflow.task.completed",
  "datacontenttype": "application/json",
  "subject": "task-123",
  "time": "2026-01-29T14:00:00Z",
  "data": {
    "task_id": "uuid",
    "user_id": "uuid",
    "completed_at": "2026-01-29T14:00:00Z",
    "next_instance_id": null,
    "recurrence_rule": {
      "frequency": "weekly",
      "interval": 1,
      "days_of_week": ["Monday"],
      "end_date": "2026-12-31T23:59:59Z",
      "max_occurrences": null
    }
  }
}
```

**Processing Logic**:
1. Extract `task_id` and `recurrence_rule` from event
2. If `recurrence_rule` is null, ignore (not a recurring task)
3. Calculate next instance date using `dateutil.rrule`
4. Create new task via Backend API with same title, description, assignee
5. Set `next_instance_id` on completed task

**Response** (200 OK):
```json
{
  "status": "SUCCESS",
  "next_instance": {
    "task_id": "uuid",
    "title": "Fix navbar bug",
    "due_at": "2026-02-05T17:00:00Z"
  }
}
```

**Error Responses**:
- `400 Bad Request`: Invalid event or recurrence rule
- `404 Not Found`: Original task not found (deleted?)
- `500 Internal Server Error`: Failed to create next instance

