## 1. Notification Service API

### 1.1 Dapr Subscription Endpoint

**Endpoint**: `GET /dapr/subscribe`

**Description**: Returns list of Kafka topics this service subscribes to (Dapr calls this on startup).

**Response** (200 OK):
```json
[
  {
    "pubsubname": "kafka-pubsub",
    "topic": "reminders",
    "route": "/events/reminders",
    "metadata": {
      "rawPayload": "false"
    }
  }
]
```

---

### 1.2 Reminder Event Handler

**Endpoint**: `POST /events/reminders`

**Description**: Dapr calls this endpoint when reminder events are published to Kafka.

**Request** (from Dapr):
```http
POST /events/reminders
Content-Type: application/json

{
  "specversion": "1.0",
  "id": "uuid",
  "source": "/teamflow/backend",
  "type": "com.teamflow.reminder.due",
  "datacontenttype": "application/json",
  "subject": "reminder-001",
  "time": "2026-01-31T17:00:00Z",
  "data": {
    "reminder_id": "uuid",
    "task_id": "uuid",
    "user_id": "uuid",
    "title": "Fix navbar bug",
    "due_at": "2026-02-01T17:00:00Z",
    "remind_at": "2026-01-31T17:00:00Z",
    "offset": "1d",
    "channels": ["email"],
    "custom_message": "Don't forget this task!"
  }
}
```

**Response** (200 OK):
```json
{
  "status": "SUCCESS"
}
```

**Error Responses**:
- `400 Bad Request`: Invalid event format
- `500 Internal Server Error`: Failed to send notification (event will be retried)

