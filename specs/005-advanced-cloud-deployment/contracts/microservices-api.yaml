## 5. Error Response Format

All error responses follow this format:

```json
{
  "error": {
    "code": "TASK_NOT_FOUND",
    "message": "Task with ID 123 not found",
    "details": {
      "task_id": "123"
    },
    "timestamp": "2026-01-29T12:00:00Z"
  }
}
```

**Error Codes**:

| Code | HTTP Status | Description |
|------|-------------|-------------|
| `AUTH_FAILED` | 401 | Invalid or missing authentication token |
| `PERMISSION_DENIED` | 403 | User does not have access to this resource |
| `TASK_NOT_FOUND` | 404 | Task does not exist or access denied |
| `INVALID_RECURRENCE_RULE` | 400 | Recurrence rule validation failed |
| `INVALID_REMINDER_SETTINGS` | 400 | Reminder settings validation failed |
| `EVENT_PROCESSING_FAILED` | 500 | Failed to process event (will retry) |
| `WEBSOCKET_AUTH_FAILED` | 401 | WebSocket token invalid |
| `SERVICE_UNAVAILABLE` | 503 | Service or dependency unavailable |

---

## 6. Rate Limiting

| Endpoint | Limit | Window |
|----------|-------|--------|
| `POST /api/v1/tasks` | 100 requests | 1 hour |
| `POST /events/*` (Dapr) | 1000 requests | 1 minute |
| `WS /ws/tasks` | 10 connections | per user |

**Response Headers**:
```
X-RateLimit-Limit: 100
X-RateLimit-Remaining: 95
X-RateLimit-Reset: 1704556800
```

---

## 7. Data Types

### RecurrenceRule
```typescript
{
  frequency: 'daily' | 'weekly' | 'monthly' | 'yearly';
  interval: number;  // >= 1
  days_of_week?: Array<'Monday' | 'Tuesday' | 'Wednesday' | 'Thursday' | 'Friday' | 'Saturday' | 'Sunday'>;
  day_of_month?: number;  // 1-31
  end_date?: string;  // ISO 8601
  max_occurrences?: number;  // >= 1
}
```

### ReminderSettings
```typescript
{
  offsets: Array<'15m' | '1h' | '1d' | '1w'>;
  channels: Array<'email' | 'push'>;
  custom_message?: string;  // max 500 chars
}
```

### TaskEvent
```typescript
{
  event_id: string;
  event_type: 'created' | 'updated' | 'completed' | 'deleted' | 'assigned';
  task_id: string;
  user_id: string;
  payload: Record<string, any>;
  created_at: string;  // ISO 8601
}
```

