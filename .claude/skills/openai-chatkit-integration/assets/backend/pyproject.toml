[project]
name = "chatkit-backend"
version = "0.1.0"
description = "Advanced ChatKit backend with Qdrant RAG and Gemini"
dependencies = [
    "openai-chatkit>=1.4.2",
    "openai-agents>=0.6.5",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"