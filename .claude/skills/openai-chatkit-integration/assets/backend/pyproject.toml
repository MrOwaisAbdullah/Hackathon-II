[project]
name = "chatkit-backend"
version = "0.1.0"
description = "Advanced ChatKit backend with Qdrant RAG and Gemini"
dependencies = [
    "openai-chatkit>=0.1.0",
    "agents-sdk>=0.15.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
