# T112: Service for RealtimeSyncService
# Type: ClusterIP - WebSocket connections via ingress

apiVersion: v1
kind: Service
metadata:
  name: {{ include "realtime-sync-service.fullname" . }}
  labels:
    {{- include "realtime-sync-service.labels" . | nindent 4 }}
  annotations:
    # Enable sticky sessions for WebSocket
    service.kubernetes.io/session-affinity: ClientIP
    service.kubernetes.io/session-affinity-config: |
      {
        "clientIP": {
          "timeoutSeconds": 3600
        }
      }
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.port }}
      targetPort: websocket
      protocol: TCP
      name: websocket
  selector:
    {{- include "realtime-sync-service.selectorLabels" . | nindent 4 }}
