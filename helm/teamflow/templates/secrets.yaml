apiVersion: v1
kind: Secret
metadata:
  name: teamflow-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.betterAuthSecret | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | default "" | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | default "" | quote }}
  QDRANT_API_KEY: {{ .Values.secrets.qdrantApiKey | default "" | quote }}
