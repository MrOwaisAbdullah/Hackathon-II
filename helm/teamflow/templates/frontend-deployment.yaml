apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "teamflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "teamflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "teamflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        # Dapr sidecar annotations (Phase 5)
        {{- if .Values.frontend.dapr.enabled }}
        dapr.io/enabled: "true"
        dapr.io/app-id: {{ .Values.frontend.dapr.appId | quote }}
        dapr.io/app-port: {{ .Values.frontend.dapr.appPort | quote }}
        dapr.io/enable-app-health-check: {{ .Values.frontend.dapr.enableAppHealthCheck | quote }}
        dapr.io/config: "dapr-config"
        {{- end }}
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.frontend.service.targetPort }}
        env:
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: teamflow-config
              key: NEXT_PUBLIC_API_URL
        - name: NODE_ENV
          value: "production"
        # Phase 5: WebSocket and PWA configuration
        - name: NEXT_PUBLIC_WS_URL
          value: {{ .Values.frontend.env.NEXT_PUBLIC_WS_URL | quote }}
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.frontend.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.frontend.readinessProbe | nindent 10 }}
